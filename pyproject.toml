[project]
name = "python-melcloud"
version = "0.1.1"
description = "Asynchronous Python client for controlling Melcloud devices."
authors = [{ name = "Erwin Douna", email = "e.douna@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
maintainers = [{ name = "Erwin Douna", email = "e.douna@gmail.com" }]
keywords = ["melcloud", "homeassistant", "api", "async", "client"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "aiohttp>=3.0.0",
  "mashumaro[orjson]>=3.17,<4",
  "tenacity>=8.0.0",
  "yarl>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/erwindouna/python-melcloud"
Repository = "https://github.com/erwindouna/python-melcloud"
Documentation = "https://github.com/erwindouna/python-melcloud"
"Bug Tracker" = "https://github.com/erwindouna/python-melcloud/issues"
Changelog = "https://github.com/erwindouna/python-melcloud/releases"

[dependency-groups]
dev = [
  "aresponses==3.0.0",
  "codespell==2.4.1",
  "covdefaults==2.3.0",
  "coverage[toml]==7.7.1",
  "freezegun==1.5.1",
  "mypy==1.15.0",
  "pre-commit==4.2.0",
  "pre-commit-hooks==5.0.0",
  "pylint==3.3.6",
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "pytest-cov==6.0.0",
  "ruff==0.11.2",
  "safety==3.3.1",
  "syrupy==5.3.1",
  "yamllint==1.37.0",
  "deptry==0.23.0",
]

[tool.hatch.build.targets.sdist]
include = ["src/pymelcloud"]

[tool.hatch.build.targets.wheel]
include = ["src/pymelcloud"]

[tool.hatch.build.targets.wheel.sources]
"src/pymelcloud" = "pymelcloud"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["pymelcloud"]

[tool.mypy]
platform = "linux"
python_version = "3.12"

follow_imports = "normal"
ignore_missing_imports = true

check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pylint.MASTER]
ignore = ["tests"]

[tool.pylint.BASIC]
good-names = ["_", "ex", "fp", "i", "id", "j", "k", "on", "Run", "T"]

[tool.pylint.DESIGN]
max-attributes = 8

[tool.pylint."MESSAGES CONTROL"]
disable = ["duplicate-code", "format", "unsubscriptable-object", "no-member", "too-many-arguments", "protected-access", "invalid-name", "wrong-import-order", "too-many-statements", "too-many-public-methods", "too-many-instance-attributes", "redefined-builtin"]

[tool.pylint.SIMILARITIES]
ignore-imports = true

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pytest.ini_options]
addopts = "--cov --cov-fail-under=90"
asyncio_mode = "auto"

[tool.ruff.lint]
ignore = [
  "ANN401",
  "D203",
  "ARG002",
  "D213",
  "D417",
  "PLR2004",
  "SLOT000",
  "TRY003",
  "EM101",
  "EM102",
  "PLR0913",
  "N815",
  "PLR0912",
  "PLR0915",
  "C901",
  "COM812",
  "ISC001",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "SLF001"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["pymelcloud"]

[tool.ruff.lint.mccabe]
max-complexity = 25
